[opcua]
endpoint_url = "opc.tcp://localhost:4855"
security_policy = "Basic256Sha256" # Optional: make this configurable
message_mode = "SignAndEncrypt"    # Optional: make this configurable
namespace_index = 2                

[identity]
app_name = "AuTHRity APC Engine"
app_uri = "urn:authrity:engine:generic" # Unique per instance
auto_create_keys = true
trust_server_certs = true

[auth]
mode = "username" # "username" | "x509"
username = "apc_engine"
password = "password"

[runtime]
model_path = "config/model.json"
reconnect_delay_sec = 5

[paths]
# Relative to executable
pki_dir = "pki"
cert_path = "pki/own/cert.der"
key_path = "pki/own/private.pem"