nodes:
  # --- SYSTEM: VP_PassBalancing ---
  - nodeId: "VP_PassBalancing:ControlNodes"
    nodeClass: "Object"
    browseName: "VP_PassBalancing:ControlNodes"

  - nodeId: "VP_PassBalancing:OperatingMode"
    nodeClass: "Variable"
    dataType: "Int32"
    initialValue: 0
  - nodeId: "VP_PassBalancing:Heartbeat"
    nodeClass: "Variable"
    dataType: "Int32"
    initialValue: 0
  - nodeId: "VP_PassBalancing:NextRun"
    nodeClass: "Variable"
    dataType: "Int32"
    initialValue: 0
  - nodeId: "VP_PassBalancing:ExecutionTimeMs"
    nodeClass: "Variable"
    dataType: "Double"
    initialValue: 0
  - nodeId: "VP_PassBalancing:SolverStatus"
    nodeClass: "Variable"
    dataType: "Int32"
    initialValue: 0
  - nodeId: "VP_PassBalancing:ObjectiveFunction"
    nodeClass: "Variable"
    dataType: "Double"
    initialValue: 0
  - nodeId: "VP_PassBalancing:ModelSelect"
    nodeClass: "Variable"
    dataType: "String"
    initialValue: ""
    comment: "Write model filename to trigger hot-swap (e.g., 'Batman_v2_model.json')"
  - nodeId: "VP_PassBalancing:AvailableModels"
    nodeClass: "Variable"
    dataType: "StringArray"
    initialValue: []
    comment: "List of available model files in model directory"
  - nodeId: "VP_PassBalancing:ConfigurationStatus"
    nodeClass: "Variable"
    dataType: "String"
    initialValue: ""
    comment: "Status messages from model loading and configuration changes"
  - nodeId: "VP_PassBalancing:SaveConfiguration"
    nodeClass: "Variable"
    dataType: "Boolean"
    initialValue: false
    comment: "Write true to export current parameters to new JSON model file"

  - nodeId: "PassBalancing:CokeEnable"
    nodeClass: "Variable"
    dataType: "Boolean"
    initialValue: false
  - nodeId: "PassBalancing:DisturbanceEnable"
    nodeClass: "Variable"
    dataType: "Boolean"
    initialValue: true
  - nodeId: "PassBalancing:Sum_Bias"
    nodeClass: "Variable"
    dataType: "Double"
    initialValue: 0.0

  # CV: Sum_Bias
  - nodeId: "Sum_Bias"
